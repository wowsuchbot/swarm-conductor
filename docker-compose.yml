version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: swarm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: swarm_conductor
      POSTGRES_INITDB_ARGS: '-E UTF8 --locale=en_US.utf8'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swarm-network

  # Redis Cache & Message Queue
  redis:
    image: redis:7-alpine
    container_name: swarm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ''
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swarm-network

  # Redis Commander (GUI)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: swarm-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - '8081:8081'
    depends_on:
      - redis
    networks:
      - swarm-network

  # Mailpit (Email testing)
  mailpit:
    image: axllent/mailpit:latest
    container_name: swarm-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'  # SMTP
      - '8025:8025'  # Web UI
    networks:
      - swarm-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  swarm-network:
    driver: bridge
    name: swarm-network
